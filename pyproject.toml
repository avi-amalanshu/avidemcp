[project]
name = "avidemcp"
version = "0.1.0"
description = "Headless MCP server for video editing and datamoshing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av>=19,<20",
    "imageio-ffmpeg>=0.8,<0.9",
    "mcp>=2.3,<3",
    "numpy>=2,<3",
]

[project.scripts]
avidemcp = "avidemcp.server:main"

[dependency-groups]
dev = ["pytest>=9"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
